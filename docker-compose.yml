services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aqualav
    ports:
      - "5432:5432"
    volumes:
      - aqualav_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aqualav"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network the database answers at "db", not localhost.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/aqualav
    ports:
      - "8000:8000"

volumes:
  aqualav_pgdata:
